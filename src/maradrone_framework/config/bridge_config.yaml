# Bridge tra ROS 2 e PX4 via Micro-XRCE-DDS
# Questi topic devono corrispondere a quelli sottoscritti dal tuo nodo di controllo.
# NOTA: PX4 aggiunge un suffisso "_v<N>" al nome del topic per i messaggi che
# dichiarano MESSAGE_VERSION >= 1 (vedi maradrone_utils/px4_topics.h). Con il
# commit di PX4-Autopilot pinnato nel Dockerfile, vehicle_status è alla
# versione 4; se aggiorni il pin, verifica il valore corrente con
# `ros2 interface show px4_msgs/msg/VehicleStatus | grep MESSAGE_VERSION`.
- topic: /fmu/in/offboard_control_mode
  type: px4_msgs/msg/OffboardControlMode
- topic: /fmu/in/trajectory_setpoint
  type: px4_msgs/msg/TrajectorySetpoint
- topic: /fmu/out/vehicle_status_v4
  type: px4_msgs/msg/VehicleStatus
- topic: /fmu/in/vehicle_command
  type: px4_msgs/msg/VehicleCommand